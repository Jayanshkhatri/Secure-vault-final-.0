<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>SecureVault - Verify OTP</title>
<style>
:root {
    --gold: #f0a500; --amber: #f5c842; --orange: #e86210;
    --bg: #0a0800; --bg-card: #110e00; --bg-input: #1a1500;
    --border-dim: rgba(240,165,0,0.15); --border-mid: rgba(240,165,0,0.3);
    --border-glow: rgba(240,165,0,0.55); --text-muted: #9a8050; --text-dim: #5a4a20;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { background: var(--bg); color: #e8d08a; min-height: 100vh;
    font-family: 'Segoe UI', system-ui, sans-serif; }
.auth-bg { position: fixed; inset: 0; z-index: 0; overflow: hidden; pointer-events: none; }
.auth-bg::before { content: ''; position: absolute; inset: 0;
    background-image: linear-gradient(var(--border-dim) 1px, transparent 1px),
    linear-gradient(90deg, var(--border-dim) 1px, transparent 1px);
    background-size: 60px 60px; opacity: 0.35; }
.auth-container { position: relative; z-index: 1; min-height: 100vh;
    display: flex; align-items: center; justify-content: center; padding: 2rem 1rem; }
.auth-box { width: 100%; max-width: 420px; background: var(--bg-card);
    border: 1px solid var(--border-dim); border-radius: 16px; padding: 2.5rem 2rem;
    position: relative; overflow: hidden; }
.auth-box::before { content: ''; position: absolute; top: 0; left: 0; right: 0;
    height: 2px; background: linear-gradient(90deg, transparent, var(--amber), var(--gold), var(--orange), transparent); }
.auth-header { text-align: center; margin-bottom: 2rem; }
.logo { font-size: 1.75rem; font-weight: 700; letter-spacing: 0.05em;
    background: linear-gradient(135deg, var(--amber), var(--gold), var(--orange));
    -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
.logo::before { content: '⬡ '; font-size: 1.2rem; -webkit-text-fill-color: var(--gold); }
.subtitle { font-size: 0.78rem; letter-spacing: 0.14em; text-transform: uppercase; color: var(--text-muted); }
.otp-info { text-align: center; margin-bottom: 1.75rem; }
.otp-info p { font-size: 0.83rem; color: var(--text-muted); line-height: 1.6; }
.otp-info span { color: var(--amber); font-weight: 600; }
.flash-message { background: rgba(232,98,16,0.12); border: 1px solid rgba(232,98,16,0.35);
    border-radius: 8px; padding: 0.65rem 1rem; font-size: 0.82rem; color: #f5a060;
    text-align: center; margin-bottom: 1.25rem; }
form { display: flex; flex-direction: column; gap: 1.1rem; }
.input-group { display: flex; flex-direction: column; gap: 0.4rem; }
.input-group label { font-size: 0.74rem; letter-spacing: 0.1em; text-transform: uppercase;
    color: var(--text-muted); font-weight: 500; }
.otp-input { background: var(--bg-input); border: 1px solid var(--border-dim);
    border-radius: 9px; padding: 0.9rem; font-size: 1.6rem; font-weight: 700;
    color: var(--amber); outline: none; width: 100%; text-align: center;
    letter-spacing: 0.4em; transition: border-color 0.2s; font-family: monospace; }
.otp-input:focus { border-color: var(--border-glow); background: #1e1800; }
.auth-btn { width: 100%; padding: 0.75rem; border: none; border-radius: 9px;
    font-size: 0.88rem; font-weight: 600; letter-spacing: 0.07em; text-transform: uppercase;
    cursor: pointer; background: linear-gradient(135deg, var(--gold), var(--amber), var(--orange));
    color: #1a1000; font-family: inherit; transition: opacity 0.2s, transform 0.15s; }
.auth-btn:hover { opacity: 0.88; }
.auth-btn:active { transform: scale(0.98); }
.resend-row { text-align: center; margin-top: 1rem; }
.resend-row a { font-size: 0.78rem; color: var(--text-muted); text-decoration: none;
    border-bottom: 1px dashed var(--border-mid); padding-bottom: 1px; transition: color 0.2s; }
.resend-row a:hover { color: var(--amber); }
.timer { font-size: 0.75rem; color: var(--text-dim); text-align: center; margin-top: 0.5rem; }
</style>
</head>
<body>
<div class="auth-bg"></div>
<div class="auth-container">
<div class="auth-box">
    <div class="auth-header">
        <h1 class="logo">SecureVault</h1>
        <p class="subtitle">OTP Verification</p>
    </div>

    <div class="otp-info">
        <p>A 6-digit OTP was sent to<br><span>{{ email }}</span></p>
        <p style="margin-top:0.4rem;font-size:0.75rem;">Expires in 10 minutes</p>
    </div>

    {% with messages = get_flashed_messages() %}
    {% if messages %}
        <div class="flash-message">{{ messages[0] }}</div>
    {% endif %}
    {% endwith %}

    <form method="POST">
        <div class="input-group">
            <label>Enter OTP</label>
            <input class="otp-input" type="text" name="otp" maxlength="6"
                placeholder="——————" autocomplete="off" required autofocus>
        </div>
        <button class="auth-btn">✓ Verify & Continue</button>
    </form>

    <div class="resend-row">
        <a href="/resend-otp">Didn't receive it? Resend OTP</a>
    </div>
    <div class="timer" id="timer">Expires in <span id="countdown">10:00</span></div>
</div>
</div>

<script>
// Auto-format OTP input
const otpInput = document.querySelector('.otp-input');
otpInput.addEventListener('input', e => {
    e.target.value = e.target.value.replace(/\D/g, '').slice(0, 6);
});

// Countdown timer
let secs = 600;
const countdown = document.getElementById('countdown');
const interval = setInterval(() => {
    secs--;
    if (secs <= 0) { clearInterval(interval); countdown.textContent = 'Expired'; return; }
    const m = Math.floor(secs / 60).toString().padStart(2, '0');
    const s = (secs % 60).toString().padStart(2, '0');
    countdown.textContent = `${m}:${s}`;
}, 1000);

// Auto-dismiss flash
setTimeout(() => {
    const f = document.querySelector('.flash-message');
    if (f) { f.style.opacity = '0'; setTimeout(() => f.remove(), 300); }
}, 3000);
</script>
</body>
</html>
